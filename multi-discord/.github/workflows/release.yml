name: Release

# Push a tag like v1.2.1 (or run this by hand) to build the installer and publish it
# as a GitHub release. Installed copies of the app can then update themselves.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point publishing at this repository
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          p.build.publish = [{ provider: 'github', owner, repo, releaseType: 'release' }];
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
