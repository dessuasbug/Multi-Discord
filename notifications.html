<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<style>
  :root {
    --bg: #17181c; --bg-deep: #121317; --hover: #22242a; --active: #2f3340; --text: #e3e5ea;
    --muted: #8a8f9c; --line: #3a3e4b; --field: #101114; --accent: #7d8cff; --on-accent: #fff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    border-left: 1px solid var(--line);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { flex: 1; font-size: 15px; font-weight: 600; margin: 0; }
  .btn {
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: transparent;
    color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .btn:hover, .btn:focus-visible { color: var(--text); background: var(--hover); outline: none; }
  .icon-btn {
    width: 28px; height: 28px; border: 0; border-radius: 6px; padding: 0; display: grid; place-items: center;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--hover); color: var(--text); outline: none; }
  ul { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  .item {
    position: relative; display: flex; gap: 12px; width: 100%; padding: 10px 12px; margin-bottom: 4px;
    border: 0; border-radius: 10px; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .item:hover, .item:focus-visible { background: var(--hover); outline: none; }
  .item.unread { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); box-shadow: inset 3px 0 0 var(--accent); }
  .item.unread:hover { background: color-mix(in srgb, var(--accent) 20%, var(--bg)); }
  .item.read .title, .item.read .body { opacity: .65; }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; margin-top: 2px;
    display: grid; place-items: center; font-weight: 600; color: #fff;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .main { flex: 1; min-width: 0; }
  .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .top .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .body {
    color: var(--muted); font-size: 13px; margin-top: 1px; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty { padding: 40px 28px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
</style>
</head>
<body>
  <header>
    <h1>Notifications</h1>
    <button class="btn" id="readAll">Mark all read</button>
    <button class="btn" id="clear">Clear</button>
    <button class="icon-btn" id="close" aria-label="Close notifications" title="Close (Esc)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </header>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>
    <strong>Nothing here yet</strong>
    Anything Discord would show as a desktop notification is collected here from every account, even when an account is muted or Do Not Disturb is on.
  </div>

<script>
  let state = { accounts: [], notifications: [] };
  const list = document.getElementById('list');

  function applyTheme(t) {
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries(t.vars)) root.setProperty(k, v);
    root.colorScheme = t.scheme;
    const n = parseInt(t.vars['--accent'].slice(1), 16);
    const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    root.setProperty('--on-accent', lum > 0.6 ? '#111' : '#fff');
  }
  function colorFor(id) {
    let h = 0;
    for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
    return `hsl(${h} 45% 42%)`;
  }
  function ago(ts) {
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return 'now';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h';
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function makeAvatar(a) {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = a.color || colorFor(a.id);
    if (a.icon && a.icon.type === 'image') {
      const img = document.createElement('img');
      img.src = a.icon.value; img.alt = '';
      av.append(img);
    } else if (a.icon && a.icon.type === 'emoji') {
      av.textContent = a.icon.value;
    } else {
      av.textContent = (a.name[0] || '?').toUpperCase();
    }
    return av;
  }

  function render() {
    applyTheme(state.theme);
    list.textContent = '';
    const byId = new Map(state.accounts.map((a) => [a.id, a]));
    const items = state.notifications.filter((n) => byId.has(n.accountId));
    document.getElementById('empty').hidden = items.length > 0;
    for (const n of items) {
      const a = byId.get(n.accountId);
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'item ' + (n.read ? 'read' : 'unread');
      b.append(makeAvatar(a));

      const main = document.createElement('div');
      main.className = 'main';
      const top = document.createElement('div');
      top.className = 'top';
      const who = document.createElement('span'); who.className = 'who'; who.textContent = a.name;
      const when = document.createElement('span'); when.textContent = ago(n.time);
      top.append(who, when);
      const title = document.createElement('div'); title.className = 'title'; title.textContent = n.title || '(no title)';
      main.append(top, title);
      if (n.body) {
        const body = document.createElement('div'); body.className = 'body'; body.textContent = n.body;
        main.append(body);
      }
      b.append(main);
      b.addEventListener('click', () => window.api.notifClick(n.id));
      li.append(b);
      list.append(li);
    }
  }

  document.getElementById('readAll').addEventListener('click', () => window.api.notifReadAll());
  document.getElementById('clear').addEventListener('click', () => window.api.notifClear());
  document.getElementById('close').addEventListener('click', () => window.api.closeNotifs());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.api.closeNotifs(); });

  window.api.onState((s) => { state = s; render(); });
  window.api.getState().then((s) => { state = s; render(); });
  setInterval(render, 30000);
</script>
</body>
</html>
